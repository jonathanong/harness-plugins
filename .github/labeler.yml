skills:
  - changed-files:
      - any-glob-to-any-file: 'plugins/*/skills/**'

evals:
  - changed-files:
      - any-glob-to-any-file:
          - 'evals/**'
          - 'plugins/*/evals/**'

plugin:
  - changed-files:
      - any-glob-to-any-file:
          - 'plugins/*/plugin.json'
          - 'plugins/*/.claude-plugin/**'
          - 'plugins/*/.codex-plugin/**'
          - '.claude-plugin/**'
          - '.agents/**'

docs:
  - changed-files:
      - any-glob-to-any-file: 'README.md'

ci:
  - changed-files:
      - any-glob-to-any-file: '.github/**'

config:
  - changed-files:
      - any-glob-to-any-file:
          - 'package.json'
          - 'pnpm-lock.yaml'
          - '.oxlintrc.json'
          - '.oxfmtrc.json'
          - 'scripts/**'
