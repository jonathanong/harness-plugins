name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  # The marketplace points at other repositories, and links point at other sites. Either can break
  # with no change here, so check once a day as well.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - name: Every skill has a skill-fired eval case
        run: pnpm run evals:check
      - name: Marketplaces agree and every plugin source resolves
        run: pnpm run marketplace:check

  links:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Links in Markdown resolve
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Relative links between skills and references, and external URLs. `.example` hosts
          # are placeholders in eval cases. The marketplace `$schema` URL is an identifier that
          # Claude Code documents but does not serve.
          args: >-
            --no-progress --exclude '\.example' --exclude 'marketplace\.schema\.json'
            '*.md' 'skills/**/*.md' 'evals/**/*.md'
            .claude-plugin/marketplace.json .agents/plugins/marketplace.json
          fail: true
